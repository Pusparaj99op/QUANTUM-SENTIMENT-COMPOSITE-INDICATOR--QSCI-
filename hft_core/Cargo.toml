[package]
name = "qsci_hft_core"
version = "0.1.0"
edition = "2021"
description = "High-frequency trading core for QSCI system"
authors = ["QSCI Trading System"]

[lib]
name = "qsci_hft_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
numpy = "0.20"
rayon = "1.8"
parking_lot = "0.12"
crossbeam-channel = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "indicators"
harness = false

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
