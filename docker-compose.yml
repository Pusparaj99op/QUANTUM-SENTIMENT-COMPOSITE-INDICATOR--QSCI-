# Docker Compose for local development and testing
version: '3.8'

services:
  qsci-trader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qsci-trading-bot
    restart: unless-stopped

    # Environment variables
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=UTC
      - PORT=8080
      # API Keys (use .env file or secrets in production)
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      # MongoDB (optional)
      - MONGODB_URI=${MONGODB_URI:-}

    # Mount volumes for data persistence
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config

    # Port mapping for health check endpoint
    ports:
      - "8080:8080"

    # Resource limits
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.25'

    # Health check
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health/live" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: MongoDB for trade persistence
  mongodb:
    image: mongo:6
    container_name: qsci-mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=qsci
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-qsci_password}
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    profiles:
      - with-db

volumes:
  mongodb_data:
