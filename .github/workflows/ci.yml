# QSCI Trading System - GitHub Actions CI/CD Pipeline
#
# This workflow runs on every push and pull request to validate:
# 1. Python syntax and linting
# 2. Unit tests
# 3. Environment variable validation
# 4. Dependency installation
#
# Author: QSCI Trading System
# Version: 1.0.0

name: QSCI CI/CD Pipeline

on:
  push:
    branches: [main, QSCI-BTC-Options-Backtester, develop]
  pull_request:
    branches: [main, QSCI-BTC-Options-Backtester]
  schedule:
    # Run daily at 6 AM UTC to catch dependency issues
    - cron: '0 6 * * *'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.10'

jobs:
  # ============================================================
  # JOB 1: Lint and Code Quality
  # ============================================================
  lint:
    name: 🔍 Lint & Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort

      - name: 🔍 Run flake8 (Python linter)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings (non-blocking)
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics \
            --exclude=qsci_venv,__pycache__,.git,BTC_DATA

      - name: 🎨 Check code formatting (Black - report only)
        run: |
          black --check --diff --color . --exclude '/(qsci_venv|__pycache__|\.git|BTC_DATA)/' || true

      - name: 📋 Check import sorting (isort - report only)
        run: |
          isort --check-only --diff . --skip qsci_venv --skip __pycache__ || true

  # ============================================================
  # JOB 2: Unit Tests
  # ============================================================
  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget

      - name: 📦 Install TA-Lib (required for technical indicators)
        run: |
          wget http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib/
          ./configure --prefix=/usr
          make
          sudo make install
          cd ..
          rm -rf ta-lib ta-lib-0.4.0-src.tar.gz

      - name: 📦 Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: 🧪 Run unit tests
        run: |
          python -m pytest tests/ -v --tb=short --color=yes

      - name: 📊 Run tests with coverage (optional)
        run: |
          python -m pytest tests/ --cov=. --cov-report=term-missing --cov-report=xml \
            --cov-omit="tests/*,qsci_venv/*,BTC_DATA/*" || true

      - name: 📤 Upload coverage report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  # ============================================================
  # JOB 3: Config Validation
  # ============================================================
  validate-config:
    name: ⚙️ Validate Configuration
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: ⚙️ Validate config.py syntax
        run: |
          python -m py_compile config.py
          echo "✅ config.py syntax is valid"

      - name: 🔐 Check for hardcoded secrets
        run: |
          # Check for potential hardcoded API keys (basic check)
          if grep -rE "(api_key|api_secret|password|token).*=.*['\"][a-zA-Z0-9]{20,}['\"]" \
            --include="*.py" --exclude-dir=qsci_venv . 2>/dev/null | \
            grep -v "os.getenv" | grep -v "TESTNET" | head -5; then
            echo "⚠️ WARNING: Potential hardcoded secrets detected!"
            echo "Consider using environment variables instead."
          else
            echo "✅ No obvious hardcoded secrets found"
          fi

      - name: 📋 Validate env.example exists
        run: |
          if [ -f "installation/env.example" ]; then
            echo "✅ env.example found"
            echo "Contents:"
            cat installation/env.example
          else
            echo "⚠️ WARNING: installation/env.example not found"
            echo "Consider creating an example environment file"
          fi

  # ============================================================
  # JOB 4: Integration Test (Optional - requires secrets)
  # ============================================================
  integration-test:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: [test, validate-config]
    # Only run on main branch or manual trigger
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install TA-Lib
        run: |
          wget http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib/
          ./configure --prefix=/usr
          make
          sudo make install
          cd ..
          rm -rf ta-lib ta-lib-0.4.0-src.tar.gz

      - name: 📦 Install dependencies
        run: |
          pip install -r requirements.txt

      - name: 🔗 Test Telegram connection (if configured)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHANNEL_ID" ]; then
            python -c "
from telegram_notifier import TelegramNotifier
notifier = TelegramNotifier()
if notifier.test_connection():
    print('✅ Telegram connection successful')
else:
    print('❌ Telegram connection failed')
    exit(1)
"
          else
            echo "⏭️ Skipping Telegram test - secrets not configured"
          fi

      - name: 🗄️ Test MongoDB connection (if configured)
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          if [ -n "$MONGODB_URI" ]; then
            python -c "
from mongodb_manager import MongoDBManager
manager = MongoDBManager()
if manager.is_connected:
    print('✅ MongoDB connection successful')
    stats = manager.get_storage_stats()
    print(f'Storage: {stats.get(\"storage_size_mb\", 0):.2f} MB')
    manager.close()
else:
    print('❌ MongoDB connection failed')
    exit(1)
"
          else
            echo "⏭️ Skipping MongoDB test - secrets not configured"
          fi

  # ============================================================
  # JOB 5: Docker Build Test
  # ============================================================
  docker-build:
    name: 🐳 Docker Build Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: qsci-trading:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # JOB 6: Dependency Security Check
  # ============================================================
  security:
    name: 🔒 Security Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install safety
        run: pip install safety

      - name: 🔒 Check dependencies for vulnerabilities
        run: |
          safety check -r requirements.txt --full-report || true

  # ============================================================
  # Final Summary
  # ============================================================
  summary:
    name: 📋 CI Summary
    runs-on: ubuntu-latest
    needs: [lint, test, validate-config, docker-build, security]
    if: always()

    steps:
      - name: 📋 Print summary
        run: |
          echo "# QSCI CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Config | ${{ needs.validate-config.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker | ${{ needs.docker-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
