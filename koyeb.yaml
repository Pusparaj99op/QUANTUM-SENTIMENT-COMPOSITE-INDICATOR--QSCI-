# Koyeb Service Configuration
# This file configures health checks and deployment settings for the QSCI Trading Bot

name: qsci-trading-bot
type: worker  # Changed from web to worker for background processing

# Docker build configuration
build:
  dockerfile: Dockerfile
  context: .

# Port configuration
ports:
  - port: 8000
    protocol: http

# Health check configuration (prevents auto-sleep)
health_checks:
  - http:
      port: 8000
      path: /health
    grace_period: 30
    interval: 60
    restart_limit: 3
    timeout: 10

# Environment variables (set these in Koyeb dashboard)
# env:
#   - key: TELEGRAM_BOT_TOKEN
#     value: your_bot_token_here
#   - key: TELEGRAM_CHANNEL_ID
#     value: your_channel_id_here
#   - key: MONGODB_URI
#     value: your_mongodb_uri_here
#   - key: INITIAL_BALANCE
#     value: "10000"
#   - key: CHECK_INTERVAL_MINUTES
#     value: "5"
#   - key: TRADING_MODE
#     value: paper

# Resource allocation
regions:
  - fra  # Change to your preferred region

# Scaling configuration
instance_type: free  # or nano, micro, small, etc.

# Auto-scaling (keeps service alive)
autoscaling:
  min: 1
  max: 1

# Routes (expose the health endpoint)
routes:
  - path: /
    port: 8000
  - path: /health
    port: 8000
  - path: /healthz
    port: 8000
